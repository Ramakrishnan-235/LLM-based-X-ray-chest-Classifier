[project]
name = "cxr-insight-ai"
version = "0.1.0"
description = "Clinical AI Agent for Autonomous Chest X-Ray Triage & Multimodal Reporting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "matplotlib>=3.9.0",
    "mlflow>=2.16.0",
    "numpy>=1.26.0,<2.0.0",
    "opencv-python-headless>=4.9.0.80",
    "pillow>=10.3.0",
    "pydantic>=2.7.0",
    "pydicom>=2.4.4",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "torchxrayvision>=1.2.4",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
